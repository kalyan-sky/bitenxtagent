<VirtualHost *:${PORT}>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride None
        Require all granted
        Options -Indexes
        # Static files (demo.html) are served directly; everything else,
        # including /widget.js, goes to the front controller.
        FallbackResource /index.php
    </Directory>

    # mod_php does not always expose the Authorization header to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
