# Cloud Run environment for the support agent.
# Copy to deploy/env.yaml (git-ignored) and edit. API keys are NOT set here:
# they come from Secret Manager (see cloudrun-deploy.sh).

MAGENTO_GRAPHQL_URL: "https://uat-magento.bitenxt.com/graphql"

# Every site that embeds the widget (scheme + host, no trailing slash), comma-separated.
# UAT Pro UI below; when going live, add the production Pro domain, e.g.
# "https://uat-pro.bitenxt.com,https://pro.bitenxt.com" (or deploy a separate prod service).
ALLOWED_ORIGINS: "https://uat-pro.bitenxt.com"

STORE_NAME: "BiteNXT"
SUPPORT_EMAIL: "support@bitenxt.com"
SUPPORT_PHONE: ""

# --- AI providers: tried in this order (primary, then fallbacks) ---
# API keys are NOT set here: they come from Secret Manager as
# LLM_GEMINI_API_KEY and LLM_OPENROUTER_API_KEY (see docs/DEPLOY-CONSOLE.md).
LLM_PROVIDERS: "gemini,openrouter"
# Gemini model ID from Google AI Studio (required; e.g. a current Gemini Flash model)
LLM_GEMINI_MODEL: ""
# OpenRouter model ID from openrouter.ai/models; must support tool calling ("Tools" filter on the models page).
# Default (when empty): DeepSeek V4.1 Flash, a low-cost model.
LLM_OPENROUTER_MODEL: "deepseek/deepseek-v4.1-flash"
# off | low | medium | high. Keep "off": thinking costs extra tokens and can use up MAX_OUTPUT_TOKENS.
LLM_OPENROUTER_REASONING: "off"
# Optional per-provider daily token caps (0 = none); over the cap, the next provider answers.
LLM_GEMINI_DAILY_TOKEN_LIMIT: "0"
LLM_OPENROUTER_DAILY_TOKEN_LIMIT: "0"

# --- Token limits (input + output tokens) against attacks and sudden spikes ---
MAX_OUTPUT_TOKENS: "400"                  # per AI reply
TOKEN_LIMIT_CUSTOMER_PER_DAY: "300000"    # per logged-in customer
TOKEN_LIMIT_GLOBAL_PER_HOUR: "200000"     # whole service
TOKEN_LIMIT_GLOBAL_PER_DAY: "1000000"     # whole service
PRO_PORTAL_URL: "https://uat-pro.bitenxt.com"  # portal link the bot gives customers
AI_HISTORY_TURNS: "6"                     # last N question/answer pairs sent to the AI
FAST_PATH: "on"                           # order lookups answered without the AI

# Optional: Slack/Teams/helpdesk incoming webhook for human handoffs.
HANDOFF_WEBHOOK_URL: ""

# Chat history: each customer has one continuous thread, kept this many days
# after their last message (then deleted automatically).
HISTORY_RETENTION_DAYS: "90"
# After this many quiet minutes, the bot starts a fresh conversation (it no
# longer sees the old messages); the customer still sees them in the window.
CONVERSATION_IDLE_MINUTES: "30"
MAX_TURNS_PER_CONVERSATION: "40"

MAX_MESSAGE_CHARS: "2000"
RATE_LIMIT_PER_MINUTE: "10"
RATE_LIMIT_PER_DAY: "200"

# 1 when traffic reaches Cloud Run directly (its own *.run.app URL or a domain
# mapping); 2 when an external HTTPS load balancer sits in front.
TRUSTED_PROXY_HOPS: "1"
