<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Support chat transcripts</title>
  <style>
    :root { --brand: #0b6e8a; --line: #e1e5e8; --muted: #6b7680; --bg: #f5f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #1d2327; background: var(--bg); }
    header { background: var(--brand); color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    input, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); }
    button { background: var(--brand); color: #fff; border: 0; cursor: pointer; }
    button.link { background: none; color: var(--brand); padding: 0; text-align: left; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row input { flex: 1; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .badge { background: #fdecea; color: #a1281b; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
    .muted { color: var(--muted); }
    .msg { max-width: 80%; margin: 6px 0; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
    .user { background: var(--brand); color: #fff; margin-left: auto; }
    .assistant { background: var(--bg); border: 1px solid var(--line); }
    .time { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
    .thread { display: flex; flex-direction: column; }
    .error { color: #a1281b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>
  <h1>Support chat transcripts</h1>
  <span id="who" class="muted"></span>
  <button id="lock" type="button" hidden>Lock</button>
</header>
<main>
  <section id="login" class="card">
    <p>Enter the staff access key. It is kept only in this browser tab.</p>
    <form id="loginForm" class="row">
      <input id="key" type="password" autocomplete="off" placeholder="Staff access key" required>
      <button type="submit">Open</button>
    </form>
    <p id="loginError" class="error"></p>
  </section>

  <div id="app" hidden>
    <section class="card">
      <form id="searchForm" class="row">
        <input id="email" type="email" placeholder="Customer account email" required>
        <button type="submit">Find customer chats</button>
        <button id="showEscalated" type="button">Handed-off chats</button>
      </form>
    </section>
    <section class="card">
      <h2 id="listTitle" style="font-size:15px;margin-top:0"></h2>
      <p id="listError" class="error"></p>
      <div id="list"></div>
    </section>
  </div>
</main>

<script>
(function () {
  'use strict';
  var KEY = 'bnx_staff_key';
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text; // never innerHTML: transcripts are untrusted text
    return n;
  }
  function when(at) { return new Date(at * 1000).toLocaleString(); }
  function key() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } }

  function api(path) {
    return fetch(path, { headers: { 'X-Staff-Key': key() || '' } }).then(function (r) {
      return r.json().then(function (d) { d._status = r.status; return d; });
    });
  }

  function showApp(on) {
    $('login').hidden = on;
    $('app').hidden = !on;
    $('lock').hidden = !on;
  }

  function renderThread(container, transcript) {
    var thread = el('div', 'thread');
    var last = 0;
    transcript.forEach(function (m) {
      if (!last || m.at - last > 1800) thread.appendChild(el('div', 'time', when(m.at)));
      last = m.at;
      thread.appendChild(el('div', 'msg ' + (m.role === 'user' ? 'user' : 'assistant'), m.text));
    });
    container.appendChild(thread);
  }

  function renderList(title, conversations, withTranscripts) {
    $('listTitle').textContent = title;
    $('listError').textContent = '';
    var list = $('list');
    list.textContent = '';
    if (!conversations.length) { list.appendChild(el('p', 'muted', 'No conversations found.')); return; }

    if (withTranscripts) {
      conversations.forEach(function (c) {
        var head = el('p', null);
        head.appendChild(el('strong', null, when(c.updated_at)));
        head.appendChild(document.createTextNode(' · ' + c.message_count + ' messages '));
        if (c.escalated) head.appendChild(el('span', 'badge', 'handed off'));
        list.appendChild(head);
        renderThread(list, c.transcript || []);
        list.appendChild(el('hr'));
      });
      return;
    }

    var table = el('table');
    var hr = el('tr');
    ['Last message', 'Customer', 'First question', 'Messages'].forEach(function (h) { hr.appendChild(el('th', null, h)); });
    table.appendChild(hr);
    conversations.forEach(function (c) {
      var tr = el('tr');
      var open = el('button', 'link', when(c.updated_at));
      open.type = 'button';
      open.onclick = function () { location.hash = 'conversation=' + c.id; };
      var td = el('td'); td.appendChild(open); tr.appendChild(td);
      var cust = el('button', 'link', c.customer_email);
      cust.type = 'button';
      cust.onclick = function () { location.hash = 'customer=' + encodeURIComponent(c.customer_email); };
      td = el('td'); td.appendChild(cust); tr.appendChild(td);
      tr.appendChild(el('td', null, c.title));
      tr.appendChild(el('td', null, String(c.message_count)));
      table.appendChild(tr);
    });
    list.appendChild(table);
  }

  function handle(d) {
    if (d._status === 401) { try { sessionStorage.removeItem(KEY); } catch (e) {} showApp(false); $('loginError').textContent = 'That key is not valid.'; return false; }
    if (d._status === 404 && d.error === 'not_found' && !location.hash) { $('loginError').textContent = 'The staff page is not enabled on this service.'; showApp(false); return false; }
    if (d._status !== 200) { $('listError').textContent = d.error === 'not_found' ? 'Conversation not found (it may have expired).' : 'Could not load (' + (d.error || d._status) + ').'; $('list').textContent = ''; return false; }
    return true;
  }

  function route() {
    if (!key()) { showApp(false); return; }
    showApp(true);
    var hash = location.hash.replace(/^#/, '');
    var m;
    if ((m = hash.match(/^conversation=([a-f0-9]{48})$/))) {
      api('/staff/api/conversation?id=' + m[1]).then(function (d) {
        if (!handle(d)) return;
        var c = d.conversation;
        renderList('Conversation with ' + c.customer_email, [c], true);
        var all = el('button', 'link', 'See all chats from this customer →');
        all.type = 'button';
        all.onclick = function () { location.hash = 'customer=' + encodeURIComponent(c.customer_email); };
        $('list').insertBefore(all, $('list').firstChild);
      });
    } else if ((m = hash.match(/^customer=(.+)$/))) {
      var email = decodeURIComponent(m[1]);
      $('email').value = email;
      api('/staff/api/customer?email=' + encodeURIComponent(email)).then(function (d) {
        if (handle(d)) renderList('All chats from ' + d.customer_email + ' (newest first)', d.conversations, true);
      });
    } else {
      api('/staff/api/escalated').then(function (d) {
        if (handle(d)) renderList('Handed-off chats (newest first)', d.conversations, false);
      });
    }
  }

  $('loginForm').onsubmit = function (e) {
    e.preventDefault();
    try { sessionStorage.setItem(KEY, $('key').value.trim()); } catch (err) {}
    $('key').value = '';
    $('loginError').textContent = '';
    route();
  };
  $('lock').onclick = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} showApp(false); };
  $('searchForm').onsubmit = function (e) { e.preventDefault(); location.hash = 'customer=' + encodeURIComponent($('email').value.trim()); };
  $('showEscalated').onclick = function () { location.hash = ''; route(); };
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
